name: Android CI/CD

on:
  push:
    branches: [ "**" ] # Matches all branches
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Release Version Name (e.g., 1.0.1)'
        required: false

jobs:
  build_debug:
    # Runs on pushes to branches that are NOT master/main
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Extract Version Name
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/novel-tracker-${{ env.VERSION }}-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-tracker-${{ env.VERSION }}-debug
          path: app/build/outputs/apk/debug/novel-tracker-*-debug.apk

  build_candidate:
    # Runs on pushes to the base branch (master/main)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Release Candidate (APK)
        run: ./gradlew assembleRelease

      - name: Extract Version Name
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/novel-tracker-${{ env.VERSION }}-rc.apk

      - name: Upload Candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-tracker-${{ env.VERSION }}-rc
          path: app/build/outputs/apk/release/novel-tracker-*-rc.apk

  build_production:
    # Runs on manual trigger
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Production Version
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.versionName }}" ]; then
            echo "PROD_VERSION=${{ github.event.inputs.versionName }}" >> $GITHUB_ENV
          else
            VERSION=$(grep 'versionName' app/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -n 1)
            IFS='.' read -ra ADDR <<< "$VERSION"
            MAJOR=${ADDR[0]:-1}
            MINOR=${ADDR[1]:-0}
            PATCH=${ADDR[2]:-0}
            NEW_PATCH=$((PATCH + 1))
            echo "PROD_VERSION=$MAJOR.$MINOR.$NEW_PATCH" >> $GITHUB_ENV
          fi

      - name: Build Production Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Rename Bundle
        run: mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/novel-tracker-${{ env.PROD_VERSION }}.aab

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: novel-tracker-${{ env.PROD_VERSION }}
          path: app/build/outputs/bundle/release/novel-tracker-*.aab
