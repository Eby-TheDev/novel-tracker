name: Android CI/CD

on:
  push:
    branches: [ "**" ] # Matches all branches
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Release Version Name (e.g., 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  build_debug:
    needs: test
    # Runs on pushes to branches that are NOT master/main
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  build_candidate:
    needs: test
    # Runs on pushes to the base branch (master/main)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Release Candidate (APK)
        run: ./gradlew assembleRelease

      - name: Upload Candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: app-candidate
          path: app/build/outputs/apk/release/*.apk

  build_production:
    needs: test
    # Runs on manual trigger
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Production Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-production
          path: app/build/outputs/bundle/release/*.aab
