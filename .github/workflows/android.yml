name: Android CI/CD

on:
  push:
    branches: [ "**" ] # Matches all branches
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Release Version Name (e.g., 1.0.1)'
        required: false

jobs:
  build_debug:
    # Runs on pushes to branches that are NOT master/main
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionSuffix=-debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  build_candidate:
    # Runs on pushes to the base branch (master/main)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Release Candidate (APK)
        run: ./gradlew assembleRelease -PversionSuffix=-rc

      - name: Upload Candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: app-candidate
          path: app/build/outputs/apk/release/*.apk

  build_production:
    # Runs on manual trigger
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Production Version
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.versionName }}" ]; then
            echo "PROD_VERSION=${{ github.event.inputs.versionName }}" >> $GITHUB_ENV
          else
            VERSION=$(grep 'appVersionName' gradle.properties | cut -d'=' -f2)
            IFS='.' read -ra ADDR <<< "$VERSION"
            # Ensure we have 3 parts, default to 0 if missing
            MAJOR=${ADDR[0]:-1}
            MINOR=${ADDR[1]:-0}
            PATCH=${ADDR[2]:-0}
            NEW_PATCH=$((PATCH + 1))
            echo "PROD_VERSION=$MAJOR.$MINOR.$NEW_PATCH" >> $GITHUB_ENV
          fi

      - name: Build Production Bundle (AAB)
        run: ./gradlew bundleRelease -PappVersionName=${{ env.PROD_VERSION }}

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-production
          path: app/build/outputs/bundle/release/*.aab
